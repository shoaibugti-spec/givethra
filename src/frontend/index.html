    <!-- ⚠️ React + Google Translate DOM ٹکراؤ کا محفوظ حل — سب سے پہلے لوڈ ہو -->
    <script>
      (function () {
        if (typeof Node !== "function" || !Node.prototype) return;

        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };

        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            return this.appendChild(newNode);
          }
          return originalInsertBefore.apply(this, arguments);
        };

        const originalReplaceChild = Node.prototype.replaceChild;
        Node.prototype.replaceChild = function (newChild, oldChild) {
          if (oldChild && oldChild.parentNode !== this) {
            return this.appendChild(newChild);
          }
          return originalReplaceChild.apply(this, arguments);
        };
      })();
    </script>

    <style>
      body { top: 0 !important; position: static !important; }

      .skiptranslate, .goog-te-banner-frame, #goog-gt-tt,
      .goog-te-balloon-frame, .goog-te-menu-frame,
      .goog-te-spinner-pos {
        display: none !important;
      }
      .goog-text-highlight {
        background: transparent !important;
        box-shadow: none !important;
      }
      html.translated-ltr, html.translated-rtl { top: 0 !important; }
    </style>

    <div id="google_translate_element" style="display:none"></div>

    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "en,ur",
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).catch((err) =>
            console.log("SW registration failed:", err)
          );
        });
      }
    </script>
